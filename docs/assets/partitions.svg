<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 316" width="780" height="316" role="img" aria-labelledby="t d">
  <title id="t">What goes where on the phone</title>
  <desc id="d">boot.img is flashed to the boot partition and holds the kernel, initramfs and device tree. mi10-arch.img is flashed to the userdata partition and holds the whole Arch Linux ARM system. The phone's own firmware partitions stay as they are; audio and modem firmware is read from them at boot.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; fill: #1f2937; }
    .title { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #4b5563; }
    .mono { font-family: "Roboto Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13.5px; }
    .file { fill: #ffffff; stroke: #3f51b5; stroke-width: 2; }
    .part { stroke-width: 2; }
    .arrow { stroke: #3f51b5; stroke-width: 2.2; fill: none; marker-end: url(#a); }
    .dashed { stroke: #6b7280; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; marker-end: url(#g); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f51b5"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="316" rx="14" fill="#f5f6fa"/>

  <text class="title" x="40" y="38">From the release</text>
  <rect class="file" x="40" y="56" width="220" height="62" rx="8"/>
  <text class="mono" x="58" y="82">boot.img</text>
  <text class="small" x="58" y="103">kernel, initramfs, device tree</text>
  <rect class="file" x="40" y="140" width="220" height="62" rx="8"/>
  <text class="mono" x="58" y="166">mi10-arch.img</text>
  <text class="small" x="58" y="187">the whole system (Plasma, apps)</text>

  <text class="title" x="440" y="38">Phone storage</text>
  <rect class="part" x="440" y="56" width="300" height="62" rx="8" fill="#e8eaf6" stroke="#3f51b5"/>
  <text class="mono" x="458" y="82">boot</text>
  <text class="small" x="458" y="103">replaced; updated by pacman later</text>
  <rect class="part" x="440" y="140" width="300" height="62" rx="8" fill="#e8eaf6" stroke="#3f51b5"/>
  <text class="mono" x="458" y="166">userdata</text>
  <text class="small" x="458" y="187">replaced; grows to fill the partition</text>
  <rect class="part" x="440" y="224" width="300" height="74" rx="8" fill="#eef2ee" stroke="#6b7280"/>
  <text class="mono" x="458" y="248">modem, persist, dtbo, …</text>
  <text class="small" x="458" y="268">left stock; the system reads audio and</text>
  <text class="small" x="458" y="285">modem firmware from here at boot</text>

  <path class="arrow" d="M260 87 H436"/>
  <text class="mono" x="348" y="78" text-anchor="middle" style="font-size:12px">fastboot flash boot</text>
  <path class="arrow" d="M260 171 H436"/>
  <text class="mono" x="348" y="162" text-anchor="middle" style="font-size:12px">fastboot flash userdata</text>

</svg>
