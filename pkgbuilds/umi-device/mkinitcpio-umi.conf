# Xiaomi Mi 10: initramfs for the boot image built by umi-update-boot.
# This drop-in overrides the matching settings of /etc/mkinitcpio.conf.
#
# - umi: GPU and Bluetooth firmware for the built-in drivers, and the panel
#   turned on early (see /usr/lib/initcpio/install/umi)
# - no autodetect: images are also built in a chroot on another machine
# - no kms: the display driver is built into the kernel
HOOKS=(base udev umi modconf keyboard block filesystems fsck)

COMPRESSION="zstd"
